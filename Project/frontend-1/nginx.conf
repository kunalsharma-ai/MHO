# Serves the prerendered site (dist/) behind the gateway. Every page is a real HTML file
# (dist/<route>/index.html), so crawlers and AI assistants get full content without running JavaScript.

# Long cache for fingerprinted build files, short revalidating cache for HTML and crawler files.
map $uri $mho_cache_control {
    default                                   "public, max-age=0, must-revalidate";
    ~^/assets/                                "public, max-age=31536000, immutable";
    ~*\.(?:woff2?|ttf|otf|eot)$               "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico)$  "public, max-age=2592000, stale-while-revalidate=86400";
    ~*\.(?:webmanifest|json)$                 "public, max-age=86400";
    ~*\.(?:xml|txt)$                          "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the proxy in front of the gateway: keep redirects relative so nginx never sends
    # visitors to http://host:80/... (that cost an extra redirect hop on every slash-less URL).
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json
               application/ld+json application/manifest+json image/svg+xml font/ttf font/otf;

    add_header Cache-Control $mho_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Canonical URLs end with "/" (see src/router.jsx). One relative 301 for slash-less page URLs.
    location ~ ^(?<mho_path>/[^.]*[^/])$ {
        if (-d $document_root$mho_path) {
            return 301 $mho_path/$is_args$args;
        }
        try_files $uri $uri.html =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Fingerprinted assets: never fall back to an HTML page for a missing file.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
