<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#07061a" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      Vite entry page. At build time:
        • Vite injects the hashed CSS/JS for src/main.jsx below.
        • scripts/prerender.mjs replaces app-head (title, description, canonical, Open Graph, JSON-LD)
          and app-html (the server-rendered page) for every route — see README → "How the build works".
      In `npm run dev` both placeholders stay empty and the page renders in the browser.
    -->
    <!--app-head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
