networks:
  db:
    external: false
  mho:
    external: false
  publicweb:
    external: true
  security:
    external: true
  validators:
    external: true
  common-utils:
    external: true

services:
  frontend-1:
    image: registry.sampledge.com/my-health-opinions/frontend:prod-2.0.0
    build:
      context: Project/frontend-1
      target: production
    restart: unless-stopped
    networks:
      - mho
  backend:
    # Always this repo's API, built on `docker compose up` (pull_policy: build) and tagged with the registry name.
    # The old prebuilt turn2opinion/backend:1.0.1 image has no /api/v1/account/* routes, so the site's login and
    # sign-up showed "Could not load the check" (issue 16).
    image: registry.sampledge.com/my-health-opinions/backend:1.0.1
    pull_policy: build
    build:
      context: Project/backend
      target: development
    restart: unless-stopped
    networks:
      - db
      - mho
    # MHO_TRUSTED_PROXIES (in the env file): proxies allowed to report the visitor's address for rate limits and
    # audit logs (utils/clientIp.js). Default "loopback,uniquelocal" = only this gateway on the docker network.
    # If a CDN or load balancer sits in front of the gateway, add its address ranges there.
    env_file:
      - ./environment/${PROJECT}.env
    container_name: ${PROJECT}-api-auth
    volumes:
      - ./Project/backend/app/controller/Profile.js:/app/app/controller/Profile.js
      - ./Project/backend/app/new-module:/app/app/new-module
      - ./uploads:/src/public/social/screenshots
      # - ./Project/backend/package.json:/src/package.json
      # - ./Project/backend/utils:/src/utils
      # - ./defaultData:/data
      - ./logs:/app/app/logs
    command: "npm run dev"
  email-template:
    image: registry.sampledge.com/microservice/email-template
    restart: unless-stopped
    volumes:
      - ./Project/mailer:/app/mailer
    networks:
      mho:
        # The API calls the template service as http://api-email-template:8080 (utils/getMailer.js). Without this
        # alias the name did not resolve and invites failed with "getaddrinfo EAI_AGAIN api-email-template" (#35).
        aliases:
          - api-email-template
  db:
    image: registry.sampledge.com/db/mongo
    container_name: ${PROJECT}-mongodb
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./db/storage:/data/db
      - ./db/dump:/backup
      - ./db/config:/data/configdb
    networks:
      - db
  email:
    image: registry.sampledge.com/microservice/email:smtp-1.0.0
    build:
      context: services/email
      target: development
    container_name: ${PROJECT}-email
    env_file:
      - environment/${PROJECT}.env
    volumes:
      - ./services/email/server.js:/app/server.js
      - ./services/email/utils:/app/utils
      - ./services/email/config:/app/config
    networks:
      - mho
      - publicweb
    restart: always
  email-scheduler:
    image: registry.sampledge.com/microservice/email-scheduler:smtp-1.0.0
    build:
      context: services/email-scheduler
      target: development
    container_name: ${PROJECT}-email-scheduler
    env_file:
      - environment/${PROJECT}.env
    volumes:
      - ./services/email-scheduler/server.js:/app/server.js
      - ./services/email-scheduler/src:/app/src
      - ./services/email-scheduler/public:/app/public
      - ./services/email-scheduler/views:/app/views
    networks:
      - db
      - publicweb
    restart: always
  mho:
    image: registry.sampledge.com/microservice/api-gateway:1.0.0
    container_name: ${PROJECT}-gateway
    restart: always
    networks:
      - publicweb
      - mho
      - security
      - common-utils
      - validators
    volumes:
      - ./services/gateway/config:/etc/nginx/http.d
      - ./services/gateway/logs:/data/logs
    dns:
      - 8.8.8.8
  storage:
    image: registry.sampledge.com/microservice/storage:1.0.0
    container_name: ${PROJECT}-service-storage
    volumes:
      - ./services/storage/uploads:/data
      - ./services/storage/hosts:/app/hosts
    environment:
      - public=/data
    networks:
      - mho
    restart: unless-stopped
  # frontend-1:
  #   # image: mfr-web:dev-1.0.0
  #   build:
  #     context: Project/frontend-1
  #     target: development
  #   restart: unless-stopped

  #   volumes:
  #    - ./Project/frontend-1:/frfs
  #    -  frontend-2_node_modules:/frfs/node_modules
  #   networks:
  #     - mho
  web-dev:
    image: ${PROJECT}-web-dev
    build:
      context: ./Project/web
      target: development
    container_name: ${PROJECT}-web
    restart: always
    env_file:
      - environment/${PROJECT}.env
    networks:
      - mho
    volumes:
      - ./Project/web/src:/app/src
      - ./Project/web/public:/app/public
      - ./Project/web/jsconfig.json:/app/jsconfig.json
      - ./Project/web/next.config.mjs:/app/next.config.mjs
      - ./Project/web/package.json:/app/package.json
      - ./uploads:/app/public/social/screenshots
  web-prod:
    # Always built from this repo on `docker compose up -d --build web-prod`. The old pinned registry image
    # (web:prod-0.0.1) predated the new member area and had no /mho-sections bundles.
    image: mho-web:prod
    pull_policy: build
    build:
      context: ./Project
      dockerfile: web/Dockerfile.prod
      target: production
    container_name: ${PROJECT}-web-prod
    restart: always
    env_file:
      - environment/${PROJECT}.env
    networks:
      - mho
  llama-agent:
    image: optiwariindia/express:api-module-1.0.1
    restart: unless-stopped
    networks:
      - mho
    volumes:
      - ./experimental/app:/src/app
      - ./experimental/package.json:/src/package.json
volumes:
  frontend-2_node_modules: