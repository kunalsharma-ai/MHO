map "$env:$request_uri" $upstream {

    # ---------- PROD ----------
    ~^prod:/api/v1/validator/email    validator-email:8080;
    ~^prod:/api/v1/get-country        security-get-country:8080;
    ~^prod:/api/v1/upload             storage:3000;
    ~^prod:/api/v1/                   backend:3000;
    ~^prod:/captcha                   security-captcha:8080;

    ~^prod:/storage                   storage:3000;
    # No public /email route: only the API sends mail, over the docker network (http://email:3000). From outside,
    # /email let anyone send mail with the site's SMTP account (#42).
    # web-prod runs `next start`, which listens on 3000 (Project/web/Dockerfile). Port 80 had nothing on it.
    ~^prod:/member                    web-prod:3000;
    ~^prod:/admin                     web-prod:3000;
    ~^prod:/_next                     web-prod:3000;
    ~^prod:/auth                      web-prod:3000;
    ~^prod:/survey                    web-prod:3000;
    # the member area's profile and survey sections (built into the web image, Project/web/Dockerfile.prod)
    ~^prod:/mho-sections              web-prod:3000;
    ~^prod:.*                         frontend-1:80;

    # ---------- DEV ----------
    ~^dev:/api/v1/validator/email     validator-email:8080;
    ~^dev:/api/v1/get-country         security-get-country:8080;
    ~^dev:/api/v1/upload              storage:3000;
    ~^dev:/api/v1/                    backend:3000;
    ~^dev:/captcha                    security-captcha:8080;
    ~^dev:/storage                    storage:3000;
    
    ~^dev:/member                     web-dev:3000;
    ~^dev:/admin                      web-dev:3000;
    ~^dev:/_next                      web-dev:3000;
    ~^dev:/auth                       web-dev:3000;
    ~^dev:/survey                     web-dev:3000;
    ~^dev:/mho-sections               web-dev:3000;
    ~^dev:.*                          frontend-1:5173;
}
