server {
    listen 80;
    listen [::]:80;

    server_name 
        mho.sampledge.duckdns.org
        myhealthopinions.com
        www.myhealthopinions.com
        new.myhealthopinions.com
        mho-prod.sampledge.duckdns.org;

    set $forward_scheme http;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    access_log /data/logs/proxy-host-mho-dev_access.log proxy;
    error_log /data/logs/proxy-host-mho-dev_error.log warn;

    include /etc/nginx/http.d/03-proxy-headers.conf;

    location / {
        proxy_pass http://$upstream;
    }
}
