# Runs the automated tests on every pull request and on pushes to Main:
#   backend (Project/backend/test, needs MongoDB), the email service (services/email/test) and the website (Project/frontend-1/test).
name: tests
on:
  pull_request:
  push:
    branches: [Main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: Project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project/backend/package-lock.json
      - run: npm ci
      - run: node --test --test-force-exit test/*.mjs
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
  email-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/email/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/frontend-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project/frontend-1/package-lock.json
      - run: npm ci
      - run: npm test
